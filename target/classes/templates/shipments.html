<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout('出荷管理・帳票出力', ~{::content})}">
<body>
<section th:fragment="content" class="p-4">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body d-flex flex-column flex-lg-row gap-3 align-items-lg-center justify-content-between">
            <div class="btn-group" role="group" aria-label="status-filter">
                <a th:href="@{/shipments(status='all')}" class="btn"
                   th:classappend="${selectedStatus == 'all'} ? ' btn-primary' : ' btn-outline-primary'">すべて</a>
                <a th:href="@{/shipments(status='allocated')}" class="btn"
                   th:classappend="${selectedStatus == 'allocated'} ? ' btn-primary' : ' btn-outline-primary'">出荷待ち（引当済）</a>
                <a th:href="@{/shipments(status='shipped')}" class="btn"
                   th:classappend="${selectedStatus == 'shipped'} ? ' btn-primary' : ' btn-outline-primary'">出荷済</a>
            </div>
            <a th:href="@{/shipments/export.csv}" class="btn btn-outline-success">
                <i class="bi bi-file-earmark-spreadsheet me-1"></i>出荷実績CSVダウンロード
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0 fw-bold"><i class="bi bi-truck me-2"></i>出荷対象一覧</h2>
            <span class="badge bg-secondary-subtle text-secondary" th:text="${#lists.size(shipments)} + '件'"></span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>注文番号</th>
                    <th>希望納期</th>
                    <th>取引先名</th>
                    <th>鋼板名・サイズ</th>
                    <th class="text-end">出荷重量</th>
                    <th>引当コイル番号（内訳）</th>
                    <th>ステータス</th>
                    <th>出荷確定日時</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(shipments)}">
                    <td colspan="9" class="text-center py-5 text-secondary">対象データがありません</td>
                </tr>
                <tr th:each="shipment : ${shipments}">
                    <td class="fw-semibold" th:text="${shipment.orderNumber}"></td>
                    <td th:classappend="${shipment.overdue} ? ' text-danger fw-bold'"
                        th:text="${#temporals.format(shipment.desiredDeliveryDate, 'yyyy/MM/dd')}"></td>
                    <td th:text="${shipment.customerName}"></td>
                    <td>
                        <span th:text="${shipment.steelName}"></span><br>
                        <small class="text-secondary" th:text="${shipment.steelCode} + ' / ' + ${shipment.steelGrade} + ' / ' + ${shipment.thickness} + 'mm × ' + ${shipment.width} + 'mm'"></small>
                    </td>
                    <td class="text-end" th:text="${#numbers.formatInteger(shipment.shipmentWeight, 1, 'COMMA')} + ' kg'"></td>
                    <td>
                        <span th:if="${#lists.isEmpty(shipment.allocationDetails)}" class="text-secondary">-</span>
                        <div th:each="detail : ${shipment.allocationDetails}" th:text="${detail}"></div>
                    </td>
                    <td>
                        <span class="badge" th:classappend="${shipment.statusBadgeClass}" th:text="${shipment.statusLabel}"></span>
                    </td>
                    <td th:text="${shipment.shippedAt != null ? #temporals.format(shipment.shippedAt, 'yyyy/MM/dd HH:mm') : '-'}"></td>
                    <td>
                        <form sec:authorize="hasAnyRole('WAREHOUSE', 'ADMIN')"
                              th:if="${shipment.status == 'ALLOCATED'}"
                              th:action="@{/shipments/{id}/confirm(id=${shipment.orderId})}"
                              method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="status" th:value="${selectedStatus}">
                            <button type="submit" class="btn btn-success btn-sm me-1"
                                    onclick="return confirm('この注文を出荷確定します。よろしいですか？')">出荷確定</button>
                        </form>
                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/shipments/{id}/mill-sheet.pdf(id=${shipment.orderId})}"
                           target="_blank" rel="noopener">ミルシートPDF</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
