<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | 鋼板受発注・在庫引当システム'">鋼板受発注・在庫引当システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --navy:#17324d; --steel:#355b78; --sidebar-width:248px; }
        body { min-height:100vh; background:#f3f6f9; color:#243746; }
        .top-navbar { height:68px; background:var(--navy); position:fixed; top:0; left:0; right:0; z-index:1030; }
        .sidebar { position:fixed; top:68px; bottom:0; left:0; width:var(--sidebar-width); background:#fff; border-right:1px solid #dde4ea; z-index:1020; }
        .sidebar-nav { padding:16px 12px; }
        .sidebar-link { display:flex; align-items:center; gap:10px; margin-bottom:6px; padding:11px 14px; border-radius:8px; color:#506778; text-decoration:none; }
        .sidebar-link:hover { background:#edf3f7; color:#17324d; }
        .sidebar-link.active { background:#e3edf5; color:#17324d; font-weight:700; border-left:4px solid #3e789f; }
        .main-content { margin-left:var(--sidebar-width); padding-top:68px; min-height:100vh; }
        .page-header { background:#fff; border-bottom:1px solid #dde4ea; }
        .user-chip { color:#fff; font-size:.85rem; }
        .developer-tools { position:absolute; bottom:16px; left:12px; right:12px; }
        .arrival-validation-message {
            height: 1.25rem;
            line-height: 1.25rem;
            margin-top: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
        }
        @media (max-width: 767.98px) {
            .sidebar { position:static; width:100%; border-right:0; }
            .main-content { margin-left:0; }
            .top-navbar { position:sticky; }
            .developer-tools { position:static; }
            .arrival-validation-message { white-space: normal; }
        }
    </style>
</head>
<body>
<nav class="navbar top-navbar navbar-dark px-3 px-lg-4">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
            <span class="d-inline-flex align-items-center justify-content-center rounded bg-light text-primary" style="width:38px;height:38px">
                <i class="bi bi-grid-3x3-gap-fill"></i>
            </span>
            <span>鋼板受発注・在庫引当システム</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <div class="user-chip text-end d-none d-md-block">
                <div class="fw-semibold" sec:authentication="principal.username">ログインユーザー</div>
                <div class="small opacity-75" sec:authentication="principal.authorities">ロール</div>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>ログアウト
                </button>
            </form>
        </div>
    </div>
</nav>

<aside class="sidebar">
    <nav class="sidebar-nav">
        <a href="/" class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? ' active'">
            <i class="bi bi-speedometer2"></i><span>ダッシュボード</span>
        </a>
        <a href="/inventories" class="sidebar-link" th:classappend="${activePage == 'inventories'} ? ' active'">
            <i class="bi bi-box-seam"></i><span>在庫照会・検索</span>
        </a>
        <a href="/orders" class="sidebar-link" th:classappend="${activePage == 'orders'} ? ' active'">
            <i class="bi bi-cart-check"></i><span>受注登録・注文一覧</span>
        </a>
        <a href="/arrivals" class="sidebar-link" th:classappend="${activePage == 'arrivals'} ? ' active'">
            <i class="bi bi-truck"></i><span>コイル入荷登録</span>
        </a>
        <a href="/shipments" class="sidebar-link" th:classappend="${activePage == 'shipments'} ? ' active'">
            <i class="bi bi-send-check"></i><span>出荷管理・帳票出力</span>
        </a>
    </nav>
    <div class="developer-tools">
        <div class="px-3 mb-2 text-secondary small fw-bold text-uppercase">開発者ツール</div>
        <a href="/h2-console" target="_blank" rel="noopener" class="sidebar-link py-2">
            <i class="bi bi-database"></i><span>H2 Console</span><i class="bi bi-box-arrow-up-right ms-auto small"></i>
        </a>
        <a href="/swagger-ui.html" target="_blank" rel="noopener" class="sidebar-link py-2">
            <i class="bi bi-braces"></i><span>Swagger UI</span><i class="bi bi-box-arrow-up-right ms-auto small"></i>
        </a>
    </div>
</aside>

<main class="main-content">
    <header class="page-header px-4 py-3">
        <h1 class="h4 mb-0 fw-bold" th:text="${pageTitle}">ページタイトル</h1>
    </header>
    <div th:replace="${content}"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
