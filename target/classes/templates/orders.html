<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout('受注登録・注文一覧', ~{::content})}">
<body>
<section th:fragment="content" class="p-4">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${warningMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-x-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div sec:authorize="hasAnyRole('SALES','ADMIN')" class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white py-3">
            <h2 class="h6 mb-0 fw-bold"><i class="bi bi-cart-plus me-2"></i>新規注文登録</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/orders}" th:object="${orderForm}" method="post"
                  onsubmit="const customerName = document.getElementById('customerName');
                            if (!customerName.value.trim()) {
                                customerName.setCustomValidity('取引先名を入力してください');
                                customerName.reportValidity();
                                return false;
                            }
                            customerName.setCustomValidity('');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold" for="customerName">取引先名</label>
                        <input id="customerName" type="text" class="form-control" th:field="*{customerName}" required
                               oninvalid="this.setCustomValidity('取引先名を入力してください')"
                               oninput="this.setCustomValidity(this.value.trim() === '' ? '取引先名を入力してください' : ''); this.nextElementSibling.textContent = ''; this.classList.remove('is-invalid')">
                        <div class="text-danger small arrival-validation-message" th:errors="*{customerName}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold" for="steelSheetId">鋼板</label>
                        <select id="steelSheetId" class="form-select" th:field="*{steelSheetId}" required
                                oninvalid="this.setCustomValidity('鋼板を選択してください')"
                                onchange="this.setCustomValidity(''); this.nextElementSibling.textContent = ''; this.classList.remove('is-invalid')">
                            <option value="">鋼板を選択してください</option>
                            <option th:each="sheet : ${steelSheets}" th:value="${sheet.steelSheetId}"
                                    th:text="${sheet.steelCode} + ' : ' + ${sheet.steelName} + ' ' + ${sheet.thickness} + '×' + ${sheet.width} + 'mm (有効在庫: ' + ${#numbers.formatInteger(availableWeights[sheet.steelSheetId], 1, 'COMMA')} + 'kg)'">
                            </option>
                        </select>
                        <div class="text-danger small arrival-validation-message" th:errors="*{steelSheetId}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-semibold" for="orderWeight">注文重量（kg）</label>
                        <input id="orderWeight" type="number" min="1" class="form-control" th:field="*{orderWeight}" required
                               oninvalid="this.setCustomValidity('注文重量を1kg以上で入力してください')"
                               oninput="this.setCustomValidity(''); this.nextElementSibling.textContent = ''; this.classList.remove('is-invalid')">
                        <div class="text-danger small arrival-validation-message" th:errors="*{orderWeight}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-semibold" for="desiredDeliveryDate">希望納期</label>
                        <input id="desiredDeliveryDate" name="desiredDeliveryDate" type="date" class="form-control"
                               th:value="${orderForm.desiredDeliveryDate != null ? #temporals.format(orderForm.desiredDeliveryDate, 'yyyy-MM-dd') : ''}" required
                               oninvalid="this.setCustomValidity('希望納期を入力してください')"
                               oninput="this.setCustomValidity(''); this.nextElementSibling.textContent = ''; this.classList.remove('is-invalid')">
                        <div class="text-danger small arrival-validation-message" th:errors="*{desiredDeliveryDate}"></div>
                    </div>
                    <div class="col-md-1 d-grid">
                        <button type="submit" class="btn btn-primary">登録</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div sec:authorize="hasRole('WAREHOUSE')" class="alert alert-light border mb-4">
        <i class="bi bi-eye me-2"></i>閲覧専用モードです。新規注文登録は営業担当または管理者のみ可能です。
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0 fw-bold"><i class="bi bi-list-check me-2"></i>注文一覧</h2>
            <span class="badge bg-secondary-subtle text-secondary" th:text="${#lists.size(orders)} + '件'"></span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>注文番号</th><th>受注日時</th><th>取引先名</th><th>鋼板名・サイズ</th>
                    <th class="text-end">注文重量</th><th class="text-end">引当済重量</th><th>希望納期</th><th>ステータス</th><th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="9" class="text-center py-5 text-secondary">注文がありません</td>
                </tr>
                <tr th:each="order : ${orders}">
                    <td class="fw-semibold" th:text="${order.orderNumber}"></td>
                    <td th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${order.customerName}"></td>
                    <td><span th:text="${order.steelName}"></span><br><small class="text-secondary" th:text="${order.steelGrade} + ' / ' + ${order.thickness} + 'mm × ' + ${order.width} + 'mm'"></small></td>
                    <td class="text-end" th:text="${#numbers.formatInteger(order.orderWeight, 1, 'COMMA')} + ' kg'"></td>
                    <td class="text-end" th:text="${#numbers.formatInteger(order.allocatedWeight, 1, 'COMMA')} + ' kg'"></td>
                    <td th:text="${#temporals.format(order.desiredDeliveryDate, 'yyyy-MM-dd')}"></td>
                    <td><span class="badge" th:classappend="${order.statusBadgeClass}" th:text="${order.statusLabel}"></span></td>
                    <td>
                        <button th:if="${order.status == 'ALLOCATED' or order.status == 'SHIPPED'}"
                                type="button" class="btn btn-outline-primary btn-sm me-1"
                                data-bs-toggle="modal" th:data-bs-target="'#allocationModal-' + ${order.orderId}">
                            引当明細
                        </button>
                        <form sec:authorize="hasAnyRole('SALES','ADMIN')"
                              th:if="${order.status == 'ALLOCATED' or order.status == 'BACKORDERED'}"
                              th:action="@{/orders/{id}/cancel(id=${order.orderId})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('この注文をキャンセルし、在庫引当を解除しますか？')">キャンセル</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:each="order : ${orders}" th:if="${order.status == 'ALLOCATED' or order.status == 'SHIPPED'}"
         class="modal fade" th:id="'allocationModal-' + ${order.orderId}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5 fw-bold">引当明細：<span th:text="${order.orderNumber}"></span></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div th:if="${#lists.isEmpty(order.allocations)}" class="text-center py-4 text-secondary">引当明細がありません</div>
                    <table th:unless="${#lists.isEmpty(order.allocations)}" class="table align-middle mb-0">
                        <thead class="table-light"><tr><th>コイル番号</th><th>入庫日</th><th class="text-end">引当重量</th></tr></thead>
                        <tbody>
                        <tr th:each="allocation : ${order.allocations}">
                            <td class="fw-semibold" th:text="${allocation.coilNumber}"></td>
                            <td th:text="${#temporals.format(allocation.arrivalDate, 'yyyy-MM-dd')}"></td>
                            <td class="text-end fw-bold" th:text="${#numbers.formatInteger(allocation.allocatedWeight, 1, 'COMMA')} + ' kg'"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button></div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
