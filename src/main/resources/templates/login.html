<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | 鋼板受発注・在庫引当システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(20, 48, 78, 0.92), rgba(47, 94, 132, 0.88)),
                linear-gradient(45deg, #dbe7f0 25%, transparent 25%);
        }
        .login-card { width: min(520px, calc(100% - 32px)); border: 0; border-radius: 18px; }
        .brand-mark { width: 54px; height: 54px; border-radius: 14px; background: #1f5f8b; }
        .form-control { min-height: 48px; }
        .btn-primary { background: #1f5f8b; border-color: #1f5f8b; }
        .demo-button { border-color: #d1dae3; color: #33516b; background: #f8fafc; }
        .demo-button:hover { background: #edf3f7; color: #1f5f8b; }
        .login-validation-message {
            height: 1.25rem;
            line-height: 1.25rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-4">
<div class="card login-card shadow-lg">
    <div class="card-body p-4 p-md-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="brand-mark d-flex align-items-center justify-content-center text-white fw-bold fs-4 shadow-sm">鋼</div>
            <div>
                <div class="text-secondary small fw-semibold">INVENTORY &amp; ORDER MANAGEMENT</div>
                <h1 class="h5 mb-0 fw-bold text-dark">家電・自動車用鋼板<br class="d-md-none"> 受発注・在庫引当システム</h1>
            </div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
            IDまたはパスワードが正しくありません
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2" role="alert">
            ログアウトしました
        </div>

        <form th:action="@{/login}" method="post"
              onsubmit="const username = document.getElementById('username');
                        const password = document.getElementById('password');
                        if (!username.value.trim()) {
                            username.setCustomValidity('ログインIDを入力してください');
                            username.reportValidity();
                            return false;
                        }
                        if (!password.value.trim()) {
                            password.setCustomValidity('パスワードを入力してください');
                            password.reportValidity();
                            return false;
                        }
                        username.setCustomValidity('');
                        password.setCustomValidity('');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">ログインID</label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="ログインIDを入力" autocomplete="username" required autofocus
                       oninvalid="this.setCustomValidity('ログインIDを入力してください')"
                       oninput="this.setCustomValidity(this.value.trim() === '' ? 'ログインIDを入力してください' : ''); document.getElementById('username-error').textContent = ''; this.classList.remove('is-invalid')">
                <div id="username-error" class="text-danger small login-validation-message"></div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">パスワード</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="パスワードを入力" autocomplete="current-password" required
                       oninvalid="this.setCustomValidity('パスワードを入力してください')"
                       oninput="this.setCustomValidity(this.value.trim() === '' ? 'パスワードを入力してください' : ''); document.getElementById('password-error').textContent = ''; this.classList.remove('is-invalid')">
                <div id="password-error" class="text-danger small login-validation-message"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">ログイン</button>
        </form>

        <div class="border-top mt-4 pt-3">
            <div class="text-secondary small text-center mb-2">デモ用ワンクリック入力</div>
            <div class="d-grid gap-2">
                <button type="button" class="btn demo-button" onclick="fillDemo('sales01', 'password')">
                    営業担当で入力
                </button>
                <button type="button" class="btn demo-button" onclick="fillDemo('warehouse01', 'password')">
                    倉庫担当で入力
                </button>
                <button type="button" class="btn demo-button" onclick="fillDemo('admin', 'password')">
                    管理者で入力
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function fillDemo(username, password) {
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        usernameInput.value = username;
        passwordInput.value = password;

        usernameInput.setCustomValidity('');
        passwordInput.setCustomValidity('');
        document.getElementById('username-error').textContent = '';
        document.getElementById('password-error').textContent = '';
        usernameInput.classList.remove('is-invalid');
        passwordInput.classList.remove('is-invalid');
    }
</script>
</body>
</html>
