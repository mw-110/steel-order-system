<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('ダッシュボード', ~{::content})}">
<body>
<section th:fragment="content" class="p-4 p-lg-4">
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <article class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3 p-4">
                    <div class="rounded-circle d-flex align-items-center justify-content-center text-primary bg-primary-subtle" style="width:56px;height:56px">
                        <i class="bi bi-cart-plus fs-4"></i>
                    </div>
                    <div>
                        <div class="text-secondary small fw-semibold">本日の受注件数</div>
                        <div class="display-6 fw-bold lh-1 mt-1"><span th:text="${summary.todayOrderCount}">0</span><small class="fs-6 ms-1">件</small></div>
                    </div>
                </div>
            </article>
        </div>
        <div class="col-md-4">
            <article class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3 p-4">
                    <div class="rounded-circle d-flex align-items-center justify-content-center text-danger bg-danger-subtle" style="width:56px;height:56px">
                        <i class="bi bi-hourglass-split fs-4"></i>
                    </div>
                    <div>
                        <div class="text-secondary small fw-semibold">引当待ち件数</div>
                        <div class="display-6 fw-bold lh-1 mt-1"><span th:text="${summary.backorderedCount}">0</span><small class="fs-6 ms-1">件</small></div>
                    </div>
                </div>
            </article>
        </div>
        <div class="col-md-4">
            <article class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3 p-4">
                    <div class="rounded-circle d-flex align-items-center justify-content-center text-success bg-success-subtle" style="width:56px;height:56px">
                        <i class="bi bi-box-arrow-right fs-4"></i>
                    </div>
                    <div>
                        <div class="text-secondary small fw-semibold">出荷待ち件数</div>
                        <div class="display-6 fw-bold lh-1 mt-1"><span th:text="${summary.allocatedCount}">0</span><small class="fs-6 ms-1">件</small></div>
                    </div>
                </div>
            </article>
        </div>
    </div>

    <section class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
            <h2 class="h5 mb-0 fw-bold"><i class="bi bi-bell-fill me-2 text-primary"></i>要対応アラート一覧</h2>
            <span class="badge bg-secondary-subtle text-secondary" th:text="${#lists.size(alerts)} + '件'">0件</span>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(alerts)}" class="text-center py-5 text-secondary">
                <i class="bi bi-check-circle fs-1 text-success d-block mb-2"></i>
                現在対応が必要なアラートはありません
            </div>

            <div th:each="alert : ${alerts}"
                 class="alert d-flex align-items-center justify-content-between gap-3 mb-3"
                 th:classappend="${alert.bootstrapClass()}"
                 role="alert">
                <div class="d-flex align-items-start gap-3">
                    <span class="badge rounded-pill" th:classappend="${alert.badgeClass()}" th:text="${alert.badgeLabel}">緊急</span>
                    <div class="fw-semibold" th:text="${alert.message}">アラートメッセージ</div>
                </div>
                <a th:href="${alert.url}" class="btn btn-sm btn-dark flex-shrink-0" th:text="${alert.buttonLabel}">確認</a>
            </div>
        </div>
    </section>
</section>
</body>
</html>
